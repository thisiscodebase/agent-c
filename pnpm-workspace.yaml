packages:
  - "."

minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustLockfile: true
# 0.8.0 is still published by Vercel GitHub Actions from vercel/vercel,
# but npm provenance attestations are missing (pnpm treats that as a trust downgrade).
trustPolicyExclude:
  - "@vercel/connect@0.8.0"
minimumReleaseAgeExclude:
  - eve
  - thinking-orbs
  - "@vercel/connect"
  - "@ai-sdk/gateway@4.0.54"
  - "@ai-sdk/provider-utils@5.0.16"
  - "@ai-sdk/provider@4.0.4"
  - "@better-auth/core@1.7.1"
  - "@better-auth/drizzle-adapter@1.7.1"
  - "@better-auth/kysely-adapter@1.7.1"
  - "@better-auth/memory-adapter@1.7.1"
  - "@better-auth/mongo-adapter@1.7.1"
  - "@better-auth/prisma-adapter@1.7.1"
  - "@better-auth/telemetry@1.7.1"
  - "@flags-sdk/vercel@1.4.6"
  - "@next/env@16.3.1"
  - "@next/swc-darwin-arm64@16.3.1"
  - "@next/swc-darwin-x64@16.3.1"
  - "@next/swc-linux-arm64-gnu@16.3.1"
  - "@next/swc-linux-arm64-musl@16.3.1"
  - "@next/swc-linux-x64-gnu@16.3.1"
  - "@next/swc-linux-x64-musl@16.3.1"
  - "@next/swc-win32-arm64-msvc@16.3.1"
  - "@next/swc-win32-x64-msvc@16.3.1"
  - "@radix-ui/react-use-controllable-state@1.2.6"
  - "@radix-ui/react-use-effect-event@0.0.5"
  - "@radix-ui/react-use-layout-effect@1.1.4"
  - "@superradcompany/microsandbox-darwin-arm64@0.6.10"
  - "@superradcompany/microsandbox-linux-arm64-gnu@0.6.10"
  - "@superradcompany/microsandbox-linux-x64-gnu@0.6.10"
  - "@superradcompany/microsandbox-win32-arm64-msvc@0.6.10"
  - "@superradcompany/microsandbox-win32-x64-msvc@0.6.10"
  - "@types/react-dom@19.2.4"
  - "@types/react@19.2.18"
  - "@vercel/cli-config@0.2.1"
  - "@vercel/flags-core@1.7.1"
  - "@vercel/oidc@3.8.1"
  - "@vue/language-core@3.3.10"
  - ai@7.0.68
  - better-auth@1.7.1
  - deslop-js@0.9.12
  - lucide-react@1.32.0
  - microsandbox@0.6.10
  - next@16.3.1
  - oxlint-plugin-react-doctor@0.9.12
  - react-doctor@0.9.12
  - shadcn@4.18.0
  - vue-tsc@3.3.10
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: false
patchedDependencies:
  thinking-orbs@0.3.1: patches/thinking-orbs@0.3.1.patch
